<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>polote.top API 文档</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.7;
            color: #333;
            background: #fff;
        }
        pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
        }
        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9em;
        }
        :not(pre) > code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px 14px;
            text-align: left;
        }
        th {
            background: #f6f8fa;
            font-weight: 600;
        }
        img { max-width: 100%; }
        blockquote {
            border-left: 4px solid #ddd;
            margin: 16px 0;
            padding: 4px 16px;
            color: #666;
        }
        h1, h2, h3 { margin-top: 28px; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="content">正在加载文档...</div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // 你的 Markdown 文件在仓库中的路径
        const MD_FILE_URL = './ningda.md';

        fetch(MD_FILE_URL)
            .then(res => {
                if (!res.ok) throw new Error('文档加载失败');
                return res.text();
            })
            .then(md => {
                document.getElementById('content').innerHTML = marked.parse(md);
            })
            .catch(err => {
                document.getElementById('content').innerHTML =
                    '<p style="color:red;">加载失败：' + err.message + '</p>';
            });
    </script>
</body>
</html>
